[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "gold-ai-trader"
version = "0.1.0"
description = "Phase 1: auditable XAUUSD M5 historical data ingestion only"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0,<2.4", "pandas>=2.2,<3"]

[project.optional-dependencies]
download = ["requests>=2.32.4,<3"]
dev = ["pytest>=8.3,<10", "ruff>=0.11,<1"]

[project.scripts]
gold-data = "gold_ai_trader.data.cli:main"

[tool.setuptools]
packages = ["gold_ai_trader", "gold_ai_trader.data"]
package-dir = {gold_ai_trader = "src"}

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["integration: local genuine-data check; skipped unless GOLD_REAL_DATA_BUNDLE is set"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["gold_ai_trader"]
